syntax = "proto3";

package net.pso.common.v1;

import "net/pso/common/v1/currency.proto";

option csharp_namespace = "Net.Pso.Common.V1";
option go_package = "github.com/psonet/pso-protobuf-common/gen/go/net/pso/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "MoneyProto";
option java_package = "net.pso.common.v1";

// Represents an amount of money with its currency type.
message Money {
  // Amount currency according to ISO 4217 standard
  Currency currency = 1;

  // The whole units of the amount.
  // For example if `currency` is `"USD"`, then 1 unit is one US dollar.
  uint64 units = 10;

  // Number of atto (10^-18) units of the amount.
  uint64 atto = 11;
}
