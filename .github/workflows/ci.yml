name: CI

# PRs: buf format, lint, breaking-change check (commented on the PR).
# Pushes to main: same checks, push the module to the BSR under the `main`
# label, then let cocogitto bump the version from conventional commits. If
# a tag is created, release.yml is dispatched for it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  buf:
    name: Buf lint, breaking, push
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(version):')"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}

  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    needs: buf
    if: github.event_name == 'push'
    permissions:
      contents: write
      # Needed to dispatch release.yml with GITHUB_TOKEN.
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # cog.toml's post_bump_hooks push the bump commit and tag.
      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

      # GITHUB_TOKEN-authored tag pushes do not fire `push` events, but
      # workflow_dispatch is allowed.
      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          if [ -z "${tag}" ]; then
            echo "No tag created — skipping release dispatch."
            exit 0
          fi
          echo "Dispatching release.yml for ${tag}."
          gh workflow run release.yml --ref "${tag}" --field "tag=${tag}"
